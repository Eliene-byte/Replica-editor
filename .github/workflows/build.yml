name: build

# O CI é o lugar onde tudo é baixado e compilado:
# ffmpeg (com checksum), o front, o servidor e o pacote portátil por sistema.
# A máquina do usuário nunca precisa de toolchain.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: testes, tipos e paridade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: testes
        run: npm test

      - name: build
        run: npm run build

      - name: paridade (replica-diff)
        run: python3 tools/parity.py replica/features.csv

      - name: varredura de marca (replica-brand)
        run: python3 tools/sweep.py . --config replica/brand.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  vendor:
    name: ffmpeg (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win-x64
            os: windows-latest
          - platform: darwin-x64
            os: macos-13
          - platform: darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: instalar ffmpeg (macOS usa brew)
        if: startsWith(matrix.platform, 'darwin')
        run: brew install ffmpeg

      - name: baixar e verificar ffmpeg
        if: ${{ !startsWith(matrix.platform, 'darwin') }}
        run: node scripts/fetch-ffmpeg.mjs ${{ matrix.platform }}

      - name: guardar binário
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: vendor/ffmpeg/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: pacote (${{ matrix.platform }})
    needs: [check, vendor]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win-x64
            os: windows-latest
          - platform: darwin-x64
            os: macos-13
          - platform: darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: vendor/ffmpeg/${{ matrix.platform }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: empacotar
        run: node scripts/package.mjs ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          retention-days: 14

  release:
    name: publicar release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*/*.zip
          generate_release_notes: true

